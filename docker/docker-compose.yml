version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: ditto-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ditto-data:/app/data
      - ../server/.env:/app/.env:ro
    environment:
      - PORT=8080
      - DATABASE_PATH=/app/data/ditto_cloud.db
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET environment variable is required. Set it in .env or export it.}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - MAX_PUSH_LIMIT=${MAX_PUSH_LIMIT:-1000}
      - SYNC_DEFAULT_PULL_LIMIT=${SYNC_DEFAULT_PULL_LIMIT:-1000}
      - SYNC_MAX_PULL_LIMIT=${SYNC_MAX_PULL_LIMIT:-5000}
      - DB_SLOW_THRESHOLD=${DB_SLOW_THRESHOLD:-500ms}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ditto-data:
    driver: local