version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ditto-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ditto-data:/app/data
      - ./server/.env:/app/.env:ro  # Optional: override config
    environment:
      - PORT=8080
      - DATABASE_PATH=/app/data/ditto_cloud.db
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ditto-net

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: ditto-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ditto-net

volumes:
  ditto-data:
    driver: local

networks:
  ditto-net:
    driver: bridge
