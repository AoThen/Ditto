version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: ditto-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ditto-data:/app/data
      - ./server/.env:/app/.env:ro
    environment:
      - PORT=8080
      - DATABASE_PATH=/app/data/ditto_cloud.db
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET environment variable is required. Set it in .env or export it.}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ditto-data:
    driver: local