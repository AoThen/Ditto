version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ditto-backend
    restart: unless-stopped
    ports:
      - "8443:8443"
    volumes:
      - ditto-data:/app/data
      - ./certs:/app/certs:ro
      - ./server/.env:/app/.env:ro
    environment:
      - PORT=8443
      - DATABASE_PATH=/app/data/ditto_cloud.db
      - JWT_SECRET=${JWT_SECRET}
      - TLS_CERT=/app/certs/server.crt
      - TLS_KEY=/app/certs/server.key
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "--no-check-certificate", "https://localhost:8443/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ditto-net

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile.prod
    container_name: ditto-frontend
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "--no-check-certificate", "https://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ditto-net

volumes:
  ditto-data:
    driver: local

networks:
  ditto-net:
    driver: bridge
