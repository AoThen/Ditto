name: Build OpenCV static libs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/build-rapidocr-onnx.bat]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Checkout OpenCVBuilder
        uses: actions/checkout@v5
        with:
          repository: RapidAI/OpenCVBuilder
          ref: 4.8.1
          path: opencvbuilder
          fetch-depth: 1

      - name: Checkout opencv source
        uses: actions/checkout@v5
        with:
          repository: opencv/opencv
          ref: 4.8.1
          path: opencvsrc
          fetch-depth: 1

      - name: Copy build files and create x64-only wrapper
        shell: powershell
        run: |
          copy opencvbuilder\build-opencv4.bat opencvsrc\
          copy opencvbuilder\opencv4_cmake_options.txt opencvsrc\
          # 创建只构建 x64 的版本
          (Get-Content opencvsrc\build-opencv4.bat) -replace 'call :cmakeParams "Win32" %VS_VER% %CRT%', '' | Set-Content opencvsrc\build-opencv4.bat

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: cmd
        run: |
          cd opencvsrc
          call build-opencv4.bat v143 mt

      - name: Package static libs
        shell: cmd
        run: |
          mkdir windows-x64
          xcopy /s /e /i opencvsrc\build-x64-v143-mt\install\include windows-x64\include\
          xcopy /s /e /i opencvsrc\build-x64-v143-mt\install\staticlib windows-x64\x64\vc17\staticlib\
          xcopy /s /e /i opencvsrc\build-x64-v143-mt\install\etc windows-x64\etc\
          7z a opencv-static-windows-x64-4.8.1.7z windows-x64\*

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: opencv-4.8.1
          name: "OpenCV 4.8.1 static libs (Windows x64, VS2022, mt)"
          prerelease: true
          artifacts: opencv-static-windows-x64-4.8.1.7z
          allowUpdates: true
          artifactContentType: application/x-7z-compressed
          token: ${{ secrets.GITHUB_TOKEN }}