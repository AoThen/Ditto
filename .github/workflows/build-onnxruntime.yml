name: Build ONNX Runtime static libs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/build-rapidocr-onnx.bat]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.11'

      - name: Checkout OnnxruntimeBuilder
        uses: actions/checkout@v5
        with:
          repository: RapidAI/OnnxruntimeBuilder
          ref: 1.15.1
          path: onnxbuilder
          fetch-depth: 1

      - name: Checkout onnxruntime source
        uses: actions/checkout@v5
        with:
          repository: microsoft/onnxruntime
          ref: v1.15.1
          path: onnxsrc
          submodules: recursive
          submodules-fetch-depth: 1
          fetch-depth: 1

      - name: Copy build script and create x64-only wrapper
        shell: powershell
        run: |
          copy onnxbuilder\build-onnxruntime.bat onnxsrc\
          # 创建只构建 x64 的版本（原脚本会构建 x64+Win32）
          (Get-Content onnxsrc\build-onnxruntime.bat) -replace 'call :cmakeParams "Win32" %VS_VER% %CRT%', '' | Set-Content onnxsrc\build-onnxruntime.bat

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: cmd
        run: |
          cd onnxsrc
          call build-onnxruntime.bat v143 mt

      - name: Package static libs
        shell: cmd
        run: |
          7z a onnxruntime-static-windows-x64-1.15.1.7z onnxsrc\build-x64-v143-mt\Release\install-static\*

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: onnxruntime-1.15.1
          name: "ONNX Runtime 1.15.1 static libs (Windows x64, VS2022, mt)"
          prerelease: true
          artifacts: onnxruntime-static-windows-x64-1.15.1.7z
          allowUpdates: true
          artifactContentType: application/x-7z-compressed
          token: ${{ secrets.GITHUB_TOKEN }}