name: Build ONNX Runtime static libs

on:
  workflow_dispatch:
  push:
    branches: [main, master, Mod]
    paths:
      - .github/workflows/build-onnxruntime.yml
      - scripts/build-onnxruntime.bat

permissions:
  contents: write

env:
  ONNX_VERSION: '1.27.1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.11'

      - name: Checkout onnxruntime source
        uses: actions/checkout@v5
        with:
          repository: microsoft/onnxruntime
          ref: v${{ env.ONNX_VERSION }}
          path: onnxsrc
          submodules: recursive
          fetch-depth: 1

      - name: Copy build script
        shell: cmd
        run: |
          copy scripts\build-onnxruntime.bat onnxsrc\

      - name: Cache ONNX Runtime build
        id: cache-onnx
        uses: actions/cache@v4
        with:
          path: onnxsrc\build-x64-v143-mt
          key: onnxruntime-build-x64-v143-mt-v5-${{ env.ONNX_VERSION }}-${{ hashFiles('.github/workflows/build-onnxruntime.yml') }}-${{ hashFiles('scripts/build-onnxruntime.bat') }}

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        if: steps.cache-onnx.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          cd onnxsrc
          call build-onnxruntime.bat v143 mt

      - name: Package static libs
        shell: cmd
        run: |
          if exist "onnxsrc\build-x64-v143-mt\install-static\lib\*.lib" (
            echo Packaging install-static...
            dir onnxsrc\build-x64-v143-mt\install-static /s /b
            cd onnxsrc\build-x64-v143-mt\install-static
            7z a %GITHUB_WORKSPACE%\onnxruntime-static-windows-x64-${{ env.ONNX_VERSION }}.7z *
          ) else (
            if exist "onnxsrc\build-x64-v143-mt\Release\install\lib" (
              echo WARNING: install-static empty, packaging install dir instead
              dir onnxsrc\build-x64-v143-mt\Release\install /s /b
              cd onnxsrc\build-x64-v143-mt\Release\install
              7z a %GITHUB_WORKSPACE%\onnxruntime-static-windows-x64-${{ env.ONNX_VERSION }}.7z *
            ) else (
              echo ERROR: No output artifacts found!
              dir onnxsrc\build-x64-v143-mt /s /b 2>nul
              7z a %GITHUB_WORKSPACE%\onnxruntime-static-windows-x64-${{ env.ONNX_VERSION }}.7z NUL
            )
          )

      - name: Verify artifact before publish
        shell: cmd
        run: |
          set "ONNX_LIB=onnxsrc\build-x64-v143-mt\install-static\lib\onnxruntime.lib"
          where dumpbin >nul 2>nul
          if errorlevel 1 exit /b 1
          if not exist "%ONNX_LIB%" exit /b 1
          rem Guard 1: no dynamic CRT /MD directive allowed
          dumpbin /directives "%ONNX_LIB%" > crt_directives.txt
          findstr /i "DEFAULTLIB:MSVCRT" crt_directives.txt >nul
          if not errorlevel 1 exit /b 1
          rem Guard 2: static CRT /MT marker must be present
          findstr /i "DEFAULTLIB:LIBCMT" crt_directives.txt >nul
          if errorlevel 1 exit /b 1
          rem Guard 3: ORT core symbols must be present (merged lib completeness)
          dumpbin /linkermember:1 "%ONNX_LIB%" > lib_members.txt
          findstr /i "OrtGetApiBase" lib_members.txt >nul
          if errorlevel 1 exit /b 1
          rem Guard 4: re2 member objects must be present
          findstr /i "re2" lib_members.txt >nul
          if errorlevel 1 exit /b 1
          rem Guard 5: public headers must be packaged - consumers cannot compile without them
          if not exist "onnxsrc\build-x64-v143-mt\install-static\include\onnxruntime_cxx_api.h" exit /b 1
          rem Guard 6: third-party implementation members must be present
          rem (mangled-name namespaces: google::protobuf, onnx::, flatbuffers::)
          findstr /i "protobuf" lib_members.txt >nul
          if errorlevel 1 exit /b 1
          findstr /i "SparseTensorProto" lib_members.txt >nul
          if errorlevel 1 exit /b 1
          findstr /i "flatbuffers" lib_members.txt >nul
          if errorlevel 1 exit /b 1
          del crt_directives.txt lib_members.txt
          echo Artifact verification passed - /MT CRT, core symbols, headers and third-party members present

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: onnxruntime-${{ env.ONNX_VERSION }}
          name: "ONNX Runtime ${{ env.ONNX_VERSION }} static libs (Windows x64, VS2022, mt)"
          prerelease: true
          artifacts: onnxruntime-static-windows-x64-${{ env.ONNX_VERSION }}.7z
          allowUpdates: true
          removeArtifacts: true
          artifactContentType: application/x-7z-compressed
          token: ${{ secrets.GITHUB_TOKEN }}
