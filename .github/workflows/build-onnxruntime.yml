name: Build ONNX Runtime static libs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/build-rapidocr-onnx.bat]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.11'

      - name: Checkout OnnxruntimeBuilder
        uses: actions/checkout@v5
        with:
          repository: RapidAI/OnnxruntimeBuilder
          ref: 1.15.1
          path: onnxbuilder

      - name: Checkout onnxruntime source
        uses: actions/checkout@v5
        with:
          repository: microsoft/onnxruntime
          ref: v1.15.1
          path: onnxsrc
          submodules: recursive

      - name: Copy build files
        shell: cmd
        run: |
          copy onnxbuilder\build-onnxruntime.bat onnxsrc\
          copy onnxbuilder\Launch-VsDevShell.ps1 onnxsrc\

      - name: Build
        shell: powershell
        run: |
          cd onnxsrc
          & '.\Launch-VsDevShell.ps1' -VsInstallationPath 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise' -SkipAutomaticLocation -HostArch amd64 -Arch amd64
          .\build-onnxruntime.bat v143 mt

      - name: Package static libs
        shell: cmd
        run: |
          7z a onnxruntime-static-windows-x64-1.15.1.7z onnxsrc\build-x64-v143-mt\Release\install-static\*

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: onnxruntime-1.15.1
          name: "ONNX Runtime 1.15.1 static libs (Windows x64, VS2022, mt)"
          prerelease: true
          artifacts: onnxruntime-static-windows-x64-1.15.1.7z
          allowUpdates: true
          artifactContentType: application/x-7z-compressed
          token: ${{ secrets.GITHUB_TOKEN }}