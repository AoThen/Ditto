name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # ── Go Backend ──────────────────────────────────────────────
  go-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: server/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: server/coverage.out
          fail_ci_if_error: false

  go-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: server/go.sum

      - name: Build
        run: go build -v -o server ./cmd/server/

  # ── Web Frontend ───────────────────────────────────────────
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build

  # ── Windows Client (C++/MFC) ──────────────────────────────
  client-build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install MFC libraries
        continue-on-error: true
        shell: pwsh
        run: |
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          Write-Host "=== Diagnose VS installation ==="
          Write-Host "vswhere exists: $(Test-Path $vswhere)"

          $vsPath = & $vswhere -latest -property installationPath
          Write-Host "VS installationPath: $vsPath"
          Write-Host "VS path exists: $(Test-Path $vsPath)"

          & $vswhere -latest -property catalog_productLine
          & $vswhere -latest -property catalog_productLineVersion
          & $vswhere -latest -property catalog_productMilestone
          & $vswhere -latest -property installationVersion

          $installer = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
          Write-Host "installer exists: $(Test-Path $installer)"

          # Try multiple known MFC component IDs
          $components = @(
            "Microsoft.VisualStudio.Component.VC.ATLMFC",
            "Microsoft.VisualStudio.Component.VC.ATLMFC.ARM64",
            "Microsoft.VisualStudio.ComponentGroup.NativeDesktop.MFC",
            "Microsoft.VisualStudio.Component.VC.v143.ATL",
            "Microsoft.VisualStudio.Component.VC.v143.MFC"
          )

          foreach ($comp in $components) {
            Write-Host "--- Trying component: $comp ---"
            & $installer modify --installPath $vsPath --add $comp --passive --wait --norestart --noUpdateInstaller
            $exitCode = $LASTEXITCODE
            Write-Host "Exit code: $exitCode"
            if ($exitCode -eq 0 -or $exitCode -eq 3010) {
              Write-Host "SUCCESS with component: $comp"
              break
            }
          }

          Write-Host "=== Diagnostic done ==="

      - name: Restore NuGet packages
        run: nuget restore CP_Main_10.sln

      - name: Build (Release x64)
        run: msbuild CP_Main.vcxproj /p:Configuration=Release /p:Platform=x64

  # ── Playwright E2E ─────────────────────────────────────────
  e2e:
    runs-on: ubuntu-latest
    needs: [ go-build, web-build ]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: server/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Build Go server
        run: cd server && go build -o server ./cmd/server/

      - name: Install Playwright browsers
        run: cd web && npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: cd web && npx playwright test
        env:
          CI: 'true'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 30

  # ── Shell E2E ──────────────────────────────────────────────
  shell-e2e:
    runs-on: ubuntu-latest
    needs: [ go-build, web-build ]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build Go server
        run: cd server && go build -o server ./cmd/server/

      - name: Run shell E2E tests
        run: ./test-e2e.sh
