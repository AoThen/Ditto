name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'server/**'
      - 'web/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'server/**'
      - 'web/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Cleanup: 清理旧 workflow runs ───────────────────────
  cleanup:
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Clean up old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 1
          keep_minimum_runs: 1
          delete_workflow_pattern: ${{ github.workflow }}

  # ── Go Backend (test + build + artifact) ────────────────
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        env:
          BCRYPT_COST: "4"
        run: go test -v -race -timeout 300s -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: server/coverage.out
          fail_ci_if_error: false

      - name: Build server binary
        run: go build -v -o server ./cmd/server/

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: server-bin
          path: server/server
          retention-days: 1

  # ── Web Frontend ───────────────────────────────────────────
  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ── Web Frontend Tests ─────────────────────────────────────
  web-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit -- --run

  # ── Windows Client (C++/MFC) ──────────────────────────────
  client-build-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Windows build environment
        uses: ./.github/actions/setup-windows-env

      - name: Build (Release x64)
        run: msbuild CP_Main_10.sln /t:CP_Main /p:Configuration=Release /p:Platform=x64 /p:VcpkgEnableManifest=true /p:VcpkgRoot=C:\vcpkg

  # ── Windows Client Tests (C++/Google Test) ────────────────
  client-test-windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Windows build environment
        uses: ./.github/actions/setup-windows-env

      - name: Build CloudSync_Test (Release x64)
        run: msbuild CP_Main_10.sln /t:CloudSync_Test /p:Configuration=Release /p:Platform=x64 /p:VcpkgEnableManifest=true /p:VcpkgRoot=C:\vcpkg

      - name: Run tests
        run: CloudSync_Test\x64\Release\CloudSync_Test.exe

  # ── Windows Client Portable ZIP (Release + Debug) ──
  client-build-portable:
    strategy:
      matrix:
        config: [Release, Debug]
      fail-fast: false
    name: Windows Client Portable ZIP (${{ matrix.config }})
    runs-on: windows-2022
    # Workflow-level concurrency would make the two matrix jobs cancel
    # each other (same group); scope it per matrix leg instead.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-portable-${{ matrix.config }}
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Windows build environment
        uses: ./.github/actions/setup-windows-env

      - name: Build (${{ matrix.config }} x64) and dependencies
        run: msbuild CP_Main_10.sln /t:CP_Main /p:Configuration=${{ matrix.config }} /p:Platform=x64 /p:VcpkgEnableManifest=true /p:VcpkgRoot=C:\vcpkg

      - name: Build OCR dependencies and models
        shell: cmd
        run: call scripts\download-ocr-deps.bat

      - name: Build DittoOCR
        run: msbuild Addins\DittoOCR\DittoOCR.vcxproj /p:Configuration=${{ matrix.config }} /p:Platform=x64 /p:SolutionDir="${{ github.workspace }}\" -v:d

      - name: Diagnostic - verify extracted dependencies
        if: always()
        shell: cmd
        run: |
          echo === ONNX Runtime ===
          if exist "Addins\DittoOCR\ocr-deps\onnxruntime-static\windows-x64" (
            dir /s /b "Addins\DittoOCR\ocr-deps\onnxruntime-static\windows-x64\include\*.h" 2>nul
            dir /s /b "Addins\DittoOCR\ocr-deps\onnxruntime-static\windows-x64\lib\*.lib" 2>nul
          ) else (
            echo ONNX Runtime directory NOT found
            dir /s "Addins\DittoOCR\ocr-deps" 2>nul
          )
          echo === OpenCV ===
          if exist "Addins\DittoOCR\ocr-deps\opencv-static\windows-x64" (
            dir /s /b "Addins\DittoOCR\ocr-deps\opencv-static\windows-x64\include\opencv2\opencv.hpp" 2>nul
            dir /s /b "Addins\DittoOCR\ocr-deps\opencv-static\windows-x64\x64\vc17\staticlib\*.lib" 2>nul
          ) else (
            echo OpenCV directory NOT found
            dir /s "Addins\DittoOCR\ocr-deps" 2>nul
          )
          echo === Diagnostic complete ===
          exit /b 0

      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ditto-diagnostic-${{ matrix.config }}-${{ github.run_id }}
          path: |
            Addins\DittoOCR\*.log
            Addins\DittoOCR\ocr-deps\**\*.log
          retention-days: 7

      - name: Locate Debug CRT directories
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VS_PATH=%%i
          if not defined VS_PATH (
            echo WARNING: VS installation not found
            exit /b 0
          )
          for /d %%d in ("%VS_PATH%\VC\Redist\MSVC\14.*") do set DEBUG_CRT_DIR=%%d\debug_nonredist\x64\Microsoft.VC143.DebugCRT
          for /d %%d in ("%VS_PATH%\VC\Redist\MSVC\14.*") do set DEBUG_MFC_DIR=%%d\debug_nonredist\x64\Microsoft.VC143.DebugMFC
          for /d %%d in ("%ProgramFiles(x86)%\Windows Kits\10\bin\10.*") do set UCRT_DEBUG_DIR=%%d\x64\ucrt
          if not exist "%DEBUG_CRT_DIR%" (
            echo WARNING: Debug CRT directory not found at %DEBUG_CRT_DIR%
            exit /b 0
          )
          echo Found Debug CRT: %DEBUG_CRT_DIR%
          echo Found Debug MFC: %DEBUG_MFC_DIR%
          echo Found ucrtbased: %UCRT_DEBUG_DIR%
          echo DEBUG_CRT_DIR=%DEBUG_CRT_DIR%>> %GITHUB_ENV%
          echo DEBUG_MFC_DIR=%DEBUG_MFC_DIR%>> %GITHUB_ENV%
          echo UCRT_DEBUG_DIR=%UCRT_DEBUG_DIR%>> %GITHUB_ENV%

      - name: Package portable zip
        shell: cmd
        env:
          BUILD_DIR: ${{ matrix.config == 'Debug' && 'Debug64' || 'Release64' }}
          RUNTIME_SUFFIX: ${{ matrix.config == 'Debug' && 'd' || '' }}
        run: |
          mkdir DittoPortable
          mkdir DittoPortable\Help
          mkdir DittoPortable\Language
          mkdir DittoPortable\Themes
          mkdir DittoPortable\Addins
          copy %BUILD_DIR%\Ditto.exe DittoPortable\
          copy %BUILD_DIR%\ICU_Loader.dll DittoPortable\
          copy %BUILD_DIR%\Addins\*.dll DittoPortable\Addins\
          xcopy /s /e /i %BUILD_DIR%\Addins\DittoOCR DittoPortable\Addins\DittoOCR\
          xcopy /s /e /i Addins\DittoOCR\models DittoPortable\Addins\DittoOCR\models\
          if "%RUNTIME_SUFFIX%"=="d" (
            if defined DEBUG_CRT_DIR (
              rem Debug redist DLLs carry the "d" suffix and MFC/UCRT live in
              rem their own directories (DebugMFC / Windows Kits ucrt).
              copy "%DEBUG_CRT_DIR%\vcruntime140d.dll" DittoPortable\
              copy "%DEBUG_CRT_DIR%\vcruntime140_1d.dll" DittoPortable\
              copy "%DEBUG_CRT_DIR%\msvcp140d.dll" DittoPortable\
              if defined DEBUG_MFC_DIR copy "%DEBUG_MFC_DIR%\mfc140ud.dll" DittoPortable\
              if defined UCRT_DEBUG_DIR copy "%UCRT_DEBUG_DIR%\ucrtbased.dll" DittoPortable\
            ) else (
              copy "%WINDIR%\System32\vcruntime140d.dll" DittoPortable\
              copy "%WINDIR%\System32\vcruntime140_1d.dll" DittoPortable\
              copy "%WINDIR%\System32\msvcp140d.dll" DittoPortable\
              copy "%WINDIR%\System32\mfc140ud.dll" DittoPortable\
              copy "%WINDIR%\System32\ucrtbased.dll" DittoPortable\
            )
          ) else (
            copy "%WINDIR%\System32\vcruntime140.dll" DittoPortable\
            copy "%WINDIR%\System32\vcruntime140_1.dll" DittoPortable\
            copy "%WINDIR%\System32\msvcp140.dll" DittoPortable\
            copy "%WINDIR%\System32\mfc140u.dll" DittoPortable\
          )
          copy DittoSetup\portable DittoPortable\portable
          copy Debug\Language\*.xml DittoPortable\Language\
          copy Debug\Themes\*.xml DittoPortable\Themes\

      - name: Verify portable package integrity
        shell: cmd
        env:
          RUNTIME_SUFFIX: ${{ matrix.config == 'Debug' && 'd' || '' }}
        run: |
          if not exist DittoPortable\Ditto.exe exit /b 1
          if not exist DittoPortable\ICU_Loader.dll exit /b 1
          if not exist DittoPortable\Addins\DittoUtil.dll exit /b 1
          if not exist DittoPortable\Addins\DittoOCR\OcrDll.dll exit /b 1
          if not exist DittoPortable\Addins\DittoOCR\models\PP-OCRv6_small_det_infer.onnx exit /b 1
          if not exist DittoPortable\Addins\DittoOCR\models\PP-OCRv6_small_rec_infer.onnx exit /b 1
          if not exist DittoPortable\Addins\DittoOCR\models\inference.yml exit /b 1
          if not exist DittoPortable\portable exit /b 1
          if not exist DittoPortable\vcruntime140%RUNTIME_SUFFIX%.dll exit /b 1
          if not exist DittoPortable\vcruntime140_1%RUNTIME_SUFFIX%.dll exit /b 1
          if not exist DittoPortable\msvcp140%RUNTIME_SUFFIX%.dll exit /b 1
          if not exist DittoPortable\mfc140u%RUNTIME_SUFFIX%.dll exit /b 1
          if "%RUNTIME_SUFFIX%"=="d" if not exist DittoPortable\ucrtbased.dll exit /b 1
          if not exist DittoPortable\Language\English.xml exit /b 1
          if not exist DittoPortable\Themes\Classic.xml exit /b 1
          echo All required files present

      - name: Create portable zip
        shell: cmd
        run: 7z a -tzip DittoPortable_${{ matrix.config }}_x64.zip DittoPortable\*

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: ditto-portable-${{ matrix.config }}-x64
          path: DittoPortable_${{ matrix.config }}_x64.zip
          retention-days: 30

  # ── Playwright E2E ─────────────────────────────────────────
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: cd web && npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: cd web && npx playwright test
        env:
          CI: 'true'
          ALLOWED_ORIGINS: http://localhost:5173

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 30

  # ── Shell E2E ──────────────────────────────────────────────
  shell-e2e:
    runs-on: ubuntu-latest
    needs: [ go ]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: server-bin
          path: server

      - name: Fix binary permissions
        run: chmod +x server/server

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Run shell E2E tests
        run: ./scripts/test-e2e.sh
