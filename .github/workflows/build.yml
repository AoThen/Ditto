name: MSBuild

on:
  workflow_dispatch:  # 允许手动触发

env:
  SOLUTION_FILE_PATH: CP_Main_10.sln

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Generate build number
        id: buildnumber
        uses: onyxmueller/build-tag-number@v1
        with:
          token: ${{secrets.GITHUB_TOKEN}} 
          
      - name: Set the value
        run: |
            echo "VERSION_FILENAME=3_25_${env:BUILD_NUMBER}_0" | Out-File -FilePath $env:GITHUB_ENV -Append
            echo "VERSION_DOT_FILENAME=3.25.${env:BUILD_NUMBER}.0" | Out-File -FilePath $env:GITHUB_ENV -Append
            
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install MFC libraries (v143)
        run: |
          $installer = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
          $vsPath = vswhere -latest -property installationPath
          $channelId = vswhere -latest -property channelId
          $productId = vswhere -latest -property productId
          Write-Host "VS path: $vsPath  channel: $channelId  product: $productId"
          & $installer modify --channelId $channelId --productId $productId `
            --add Microsoft.VisualStudio.Component.VC.14.44.17.14.x86.x64 `
            --add Microsoft.VisualStudio.Component.VC.14.44.17.14.MFC `
            --add Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL `
            --add Microsoft.VisualStudio.Component.VC.ATLMFC `
            --quiet --wait --norestart
          if ($LASTEXITCODE -ne 0) { throw "MFC install failed with code $LASTEXITCODE" }
          Get-ChildItem (Join-Path $vsPath "VC\Tools\MSVC") -Recurse -Filter "mfc*.lib" -ErrorAction SilentlyContinue | Select-Object -First 5 | ForEach-Object { Write-Host "Found MFC lib: $($_.FullName)" }

      - name: Restore NuGet packages
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: nuget restore ${{env.SOLUTION_FILE_PATH}}
        
      - name: Build
        run: msbuild CP_Main_10.sln /p:Configuration=Release /p:Platform=x64
        
      - name: Set Versions
        run: |
            DittoSetup\rcedit-x64 Release64\Ditto.exe --set-file-version ${{env.VERSION_DOT_FILENAME}} --set-product-version ${{env.VERSION_DOT_FILENAME}}
                   
      - name: Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
        with:
          path: DittoSetup\DittoSetup_10.iss
          
      - name: Build Portable
        run: |
            DittoSetup\BuildPortableZIP.bat "DittoPortable_${{env.VERSION_FILENAME}}" bit64
            
      - name: Upload final artifacts
        uses: actions/upload-artifact@v4
        with:
          name: final-output
          path: |
            DittoSetup\output\DittoSetup_${{env.VERSION_FILENAME}}.exe
            DittoSetup\output\DittoPortable_${{env.VERSION_FILENAME}}.zip