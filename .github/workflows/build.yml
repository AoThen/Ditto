name: MSBuild

on:
  workflow_dispatch:  # 允许手动触发

env:
  SOLUTION_FILE_PATH: CP_Main_10.sln

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Generate build number
        id: buildnumber
        uses: onyxmueller/build-tag-number@v1
        with:
          token: ${{secrets.GITHUB_TOKEN}} 
          
      - name: Set the value
        run: |
            echo "VERSION_FILENAME=3_25_${env:BUILD_NUMBER}_0" | Out-File -FilePath $env:GITHUB_ENV -Append
            echo "VERSION_DOT_FILENAME=3.25.${env:BUILD_NUMBER}.0" | Out-File -FilePath $env:GITHUB_ENV -Append
            
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Provide v143 MFC libs
        run: |
          $vsPath = vswhere -latest -property installationPath
          $msvc = Join-Path $vsPath "VC\Tools\MSVC"
          $v145 = Get-ChildItem $msvc -Directory | Where-Object { $_.Name -match '^14\.5' } | Sort-Object Name | Select-Object -Last 1
          $v143 = Get-ChildItem $msvc -Directory | Where-Object { $_.Name -match '^14\.4[0-9]' } | Sort-Object Name | Select-Object -Last 1
          if (-not $v143) { throw "No v143 toolset found under $msvc" }
          if (-not $v145) { throw "No v145 toolset found under $msvc (source of MFC libs)" }
          $src = Join-Path $v145.FullName "atlmfc"
          $dst = Join-Path $v143.FullName "atlmfc"
          if (Test-Path $dst) {
            Write-Host "atlmfc already present in $($v143.Name); skipping copy"
          } else {
            Write-Host "Copying atlmfc from $($v145.Name) to $($v143.Name)"
            Copy-Item $src $dst -Recurse
          }
          Get-ChildItem $dst -Recurse -Filter "mfc*.lib" -ErrorAction SilentlyContinue | Select-Object -First 3 | ForEach-Object { Write-Host "Found: $($_.FullName)" }

      - name: Restore NuGet packages
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: nuget restore ${{env.SOLUTION_FILE_PATH}}
        
      - name: Build
        run: msbuild CP_Main_10.sln /p:Configuration=Release /p:Platform=x64
        
      - name: Set Versions
        run: |
            DittoSetup\rcedit-x64 Release64\Ditto.exe --set-file-version ${{env.VERSION_DOT_FILENAME}} --set-product-version ${{env.VERSION_DOT_FILENAME}}
                   
      - name: Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
        with:
          path: DittoSetup\DittoSetup_10.iss
          
      - name: Build Portable
        run: |
            DittoSetup\BuildPortableZIP.bat "DittoPortable_${{env.VERSION_FILENAME}}" bit64
            
      - name: Upload final artifacts
        uses: actions/upload-artifact@v4
        with:
          name: final-output
          path: |
            DittoSetup\output\DittoSetup_${{env.VERSION_FILENAME}}.exe
            DittoSetup\output\DittoPortable_${{env.VERSION_FILENAME}}.zip