name: CloudSync Compilation Check

on:
  push:
    branches:
      - master
    paths:
      - 'src/CloudSync/**'
      - 'CP_Main.vcxproj'
      - 'CP_Main_10.sln'
      - '.github/workflows/cloudsync-check.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'src/CloudSync/**'
      - 'CP_Main.vcxproj'
      - 'CP_Main_10.sln'
  workflow_dispatch:  # 允许手动触发

env:
  SOLUTION_FILE_PATH: CP_Main_10.sln

jobs:
  cloudsync-compile-check:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Release, Debug]
        platform: [x64, Win32]
      fail-fast: false  # 一个失败不阻断其他组合

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build ${{matrix.configuration}} ${{matrix.platform}}
        run: |
          # Skip NuGet restore - CloudSync module doesn't depend on NuGet packages
          # (libpng/zlib are for image handling, CloudSync uses Windows CNG API only)
          msbuild ${{env.SOLUTION_FILE_PATH}} `
            /p:Configuration=${{matrix.configuration}} `
            /p:Platform=${{matrix.platform}} `
            /p:BuildInParallel=true `
            /p:RestorePackagesConfig=false `
            /m `
            /verbosity:minimal `
            /nologo `
            /t:CP_Main

      - name: Check CloudSync object files
        if: success() || failure()
        run: |
          $platformDir = if ('${{matrix.platform}}' -eq 'x64') { 'x64' } else { '' }
          $configDir = if ('${{matrix.configuration}}' -eq 'Release' -and $platformDir) { "Release64" }
                       elseif ('${{matrix.configuration}}' -eq 'Release') { "Release" }
                       elseif ('${{matrix.configuration}}' -eq 'Debug' -and $platformDir) { "Debug64" }
                       else { "Debug" }
          
          Write-Host "Checking build output in: $configDir"
          if (Test-Path $configDir) {
            Get-ChildItem -Path $configDir -Recurse -Filter "*.obj" | 
              Where-Object { $_.Name -like "*Cloud*" } | 
              ForEach-Object { Write-Host "Found: $($_.Name)" }
          }
          
          # Check if main executable was built
          $exePath = if ($platformDir) { "${configDir}\Ditto.exe" } else { "${configDir}\Ditto.exe" }
          if (Test-Path $exePath) {
            $exeSize = (Get-Item $exePath).Length
            Write-Host "SUCCESS: Built ${exePath} (${exeSize} bytes)"
          } else {
            Write-Host "WARNING: Executable not found at $exePath"
            Get-ChildItem -Path $configDir -Filter "*.exe" -ErrorAction SilentlyContinue | 
              ForEach-Object { Write-Host "Found exe: $($_.FullName)" }
          }

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cloudsync-build-${{matrix.configuration}}-${{matrix.platform}}
          path: |
            Release64/Ditto.exe
            Release64/Ditto.pdb
            Release/Ditto.exe
            Release/Ditto.pdb
            Debug64/Ditto.exe
            Debug64/Ditto.pdb
            Debug/Ditto.exe
            Debug/Ditto.pdb
          retention-days: 7
          if-no-files-found: ignore

  summary:
    needs: cloudsync-compile-check
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.cloudsync-compile-check.result }}" = "success" ]; then
            echo "✅ CloudSync compilation check PASSED"
            echo "All configuration builds succeeded"
          else
            echo "❌ CloudSync compilation check FAILED"
            echo "Check the job logs for detailed error messages"
            exit 1
          fi
